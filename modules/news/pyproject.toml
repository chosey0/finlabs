[project]
name = "finlabs-news"
version = "0.1.0"
description = "RSS news collection, normalization, and analysis pipeline for FinLabs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "feedparser>=6.0.12",
    "finlabs-kis",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[tool.uv.sources]
finlabs-kis = { path = "../brokers/kis", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["../.."]

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "db",
    "main.py",
    "pipeline.py",
    "rss",
    "schema",
    "symbols.py",
]

[tool.hatch.build.targets.wheel.sources]
"" = "modules/news"
