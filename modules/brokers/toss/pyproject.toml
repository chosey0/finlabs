[project]
name = "finlabs-toss"
version = "0.1.0"
description = "Pure Python SDK for the Toss Securities Open API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["../../.."]

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "_internal",
    "auth.py",
    "client.py",
    "config.py",
    "exceptions.py",
    "market.py",
    "models.py",
    "parsers.py",
    "stocks.py",
    "types.py",
]

[tool.hatch.build.targets.wheel.sources]
"" = "modules/brokers/toss"
