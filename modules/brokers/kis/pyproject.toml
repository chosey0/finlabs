[project]
name = "finlabs-kis"
version = "0.1.0"
description = "Pure Python SDK for the Korea Investment & Securities Open API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27.0", "websockets>=13.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = ["../../.."]

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "_internal",
    "auth",
    "client.py",
    "config.py",
    "endpoints",
    "exceptions.py",
    "models",
    "overseas",
    "parsers",
    "realtime",
    "symbols.py",
    "types.py",
]
exclude = ["**/AGENTS.md"]

[tool.hatch.build.targets.wheel.sources]
"" = "modules/brokers/kis"
