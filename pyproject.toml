[project]
name = "kis-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
    "psycopg>=3.3.4",
    "pytest>=9.0.3",
    "rich>=13.0.0",
    "rich-inquirer>=0.1.8",
    "ruff>=0.15.12",
    "typer>=0.12.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.0",
]
all = [
    "psycopg[binary]>=3.2.0",
]

[project.scripts]
kiscli = "kis_cli.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kis", "kis_cli"]
