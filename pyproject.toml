[project]
name = "finlabs"
version = "0.1.0"
description = "Local-first brokerage Open API toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "kaleido>=0.2.1",
    "matplotlib>=3.10.9",
    "platformdirs>=4.0.0",
    "plotly>=5.24.0",
    "psycopg>=3.3.4",
    "pytest>=9.0.3",
    "rich>=13.0.0",
    "rich-inquirer>=0.1.8",
    "ruff>=0.15.12",
    "streamlit>=1.58.0",
    "typer>=0.12.0",
    "uvicorn>=0.30.0",
    "websockets>=13.0",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2.0",
]
tokenizers = [
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "torch>=2.2.0",
]
all = [
    "psycopg[binary]>=3.2.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "scikit-learn>=1.5.0",
]

[tool.uv]
package = false
