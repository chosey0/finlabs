[project]
name = "finlabs"
version = "0.1.0"
description = "Local-first brokerage Open API toolkit"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "broker-modules",
    "finlabs-core",
    "httpx>=0.27.0",
    "platformdirs>=4.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "rich-inquirer>=0.1.8",
    "textual>=8.2.7",
    "typer>=0.12.0",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.12"]
server = ["fastapi>=0.115.0", "uvicorn>=0.30.0"]
dashboard = ["plotly>=5.24.0", "streamlit>=1.58.0"]
research = [
    "kaleido>=0.2.1",
    "matplotlib>=3.10.9",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "torch>=2.2.0",
]
crawler = ["scrapy>=2.16.0"]
modeling = ["lightgbm>=4.0.0"]
news = ["finlabs-news"]
toss = ["broker-modules"]
postgres = ["psycopg[binary]>=3.2.0", "psycopg-pool>=3.2.0"]

[tool.uv]
package = false
default-groups = ["dev", "postgres"]

[tool.uv.sources]
broker-modules = { git = "https://github.com/chosey0/broker-modules.git" }
finlabs-core = { workspace = true }
finlabs-news = { workspace = true }

[tool.uv.workspace]
members = [
    "modules",
    "modules/news",
]
